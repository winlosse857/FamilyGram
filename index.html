<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#1f2733"><title>Zvon</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body>
<section id="welcome" class="screen on"><svg width="170" height="170" viewBox="0 0 200 200"><circle cx="100" cy="100" r="100" fill="#229ef0"/><path fill="#fff" d="M55 60h90a15 15 0 0 1 15 15v50a15 15 0 0 1-15 15h-55l-25 22v-22h-10a15 15 0 0 1-15-15v-50a15 15 0 0 1 15-15z"/></svg><h1>Zvon</h1><p>Быстрый и простой мессенджер.<br>Личные чаты один на один.</p><button class="btn" id="go">Начать общение</button></section>
<section id="auth" class="screen"><h2 id="authTitle">Вход</h2><form id="authForm"><input id="u" placeholder="Имя пользователя" autocomplete="username" autocapitalize="none" required><input id="p" type="password" placeholder="Пароль" autocomplete="current-password" required><div id="err" class="err" role="alert"></div><button class="btn" id="authBtn">Войти</button></form><button class="link" id="swap">Нет аккаунта? Зарегистрироваться</button></section>
<section id="chats" class="screen"><header><b>Zvon</b><button class="link" id="out">Выйти</button></header><input id="search" class="search" placeholder="Найти пользователя" autocapitalize="none"><div id="list" class="list"></div></section>
<section id="chat" class="screen"><header><button class="link" id="back" aria-label="Назад">←</button><b id="peerName"></b></header><div id="msgs" class="msgs"></div><form id="sendForm" class="send"><input id="text" placeholder="Сообщение" autocomplete="off"><button class="btn round" aria-label="Отправить">➤</button></form></section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script><script src="config.js"></script><script src="app.js"></script></body></html>
